[package]
name = "rs-chiketto"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Redmineのハイスピードでハイセキュリティで省メモリなRust+RPoem版(v0.1.0時点はチケット管理の最小実装のみ)"
repository = "https://github.com/aon-co-jp/open-redmine"

[[bin]]
name = "rs-chiketto"
path = "src/main.rs"

[dependencies]
poem = { version = "3.1", features = ["test", "multipart"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
thiserror = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"
ssh2 = { version = "0.9", optional = true }

[features]
sftp = ["dep:ssh2"]
