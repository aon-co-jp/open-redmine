[package]
name = "rs-red-web"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "open-redmine(Redmine Rust版)のブラウザフロントエンド(Rust→WebAssembly、オンライン専用、Tauri/Node.js/TypeScript不使用)。標準のviewportメタタグによりAndroid等モバイルブラウザのピンチズームがそのまま機能する(特別な実装不要)。"
repository = "https://github.com/aon-co-jp/open-redmine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "Document",
    "Element",
    "DomTokenList",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlButtonElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Node",
    "NodeList",
    "Event",
    "EventTarget",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Storage",
    "FormData",
    "File",
    "FileList",
    "Url",
    "Blob",
]
